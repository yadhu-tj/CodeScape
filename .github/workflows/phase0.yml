name: Phase 0 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Tests need repository read access; they do not publish code or use provider keys.
permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tools:
    name: Host tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate fixture syntax, inventory and hashes without executing target code
        run: python backend/utils/validate_harness.py
      - name: Test orchestration and evidence validation without Docker or target imports
        run: python -m unittest discover -s backend/tests -v

  sandbox:
    name: Docker baseline and contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # Build-time dependency downloads are allowed. Runtime tests remain offline.
      - name: Build sandbox and verify clean baseline, integration smoke and seeded contract
        run: python backend/utils/build_sandbox.py --evidence data/evidence/phase0-ci.json
      - name: Retain complete evidence including failed-run diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-container-evidence
          path: data/evidence/phase0-ci.json
          retention-days: 14
          if-no-files-found: warn
