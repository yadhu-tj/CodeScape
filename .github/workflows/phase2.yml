name: Phase 2 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend ingestion (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codescape_test
          POSTGRES_USER: codescape_test
          POSTGRES_PASSWORD: codescape-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U codescape_test -d codescape_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate PostgreSQL and run the backend suite
        env:
          DATABASE_URL: postgresql+asyncpg://codescape_test:codescape-test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/codescape_test
        run: |
          export CODESCAPE_PHASE2_TEST_DATABASE_URL="$DATABASE_URL"
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m unittest discover -s backend/tests -v
